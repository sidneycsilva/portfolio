<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Sidney Carvalho Silva">
    <meta name="description" content="Portfólio de desenvolvedor web especializado em aplicações modernas, responsivas e bem estruturadas.">
    <meta name="theme-color" content="#0a9ecf">
    <title>Portifólio - Sobre Mim</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <section class="hero-wrapper">
        <div id="header"></div>

        <div class="hero">

            <div class="conteiner-card">
                <h1 class="titulo-secao">Sobre Mim</h1>

                <div class="card">
                    <div class="card-body">
                        <img src="./img/maleta.png" alt="Profissão">
                        <div class="card-info">
                            <h5>Profissão:</h5>
                            <p>Desenvolvedor Web / Banco de Dados / Sistemas</p>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <img src="./img/monitor.png" alt="Especialidades">
                        <div class="card-info">
                            <h5>Especialidades:</h5>
                            <p>Front-End / Back-End</p>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <img src="./img/calendario.png" alt="Experiência">
                        <div class="card-info">
                            <h5>Experiência:</h5>
                            <p>Mais de 15 anos atuando</p>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <img src="./img/tecnologia.png" alt="Tecnologias">
                        <div class="card-info">
                            <h5>Tecnologias:</h5>
                            <p>HTML, CSS, JS, SQL, Python, MS Access VBA</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="imge-sobre-mim">
                <img src="./img/img-sobre.png" alt="Ilustração de Desenvolvedor">
            </div>

            

        </div>
    </section>

    <script src="js/javascript.js"></script>
</body>
</html>
